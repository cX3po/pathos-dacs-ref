name: 'DACS conformance / drift check'
description: 'Run dacs-drift against your AttestationBundle fixtures — fail CI when a bundleHash drifts from the expected/golden value.'
author: 'PATH-OS Labs'
branding:
  icon: 'check-circle'
  color: 'green'

inputs:
  fixtures-dir:
    description: 'Directory (in your repo) of *.json AttestationBundle fixtures to check.'
    required: true
  expect-manifest:
    description: 'Optional JSON manifest { "<fixture>.json": "<expectedHashHex>" } (in your repo). Omit for discovery mode (compute + structurally verify, never fails on hash).'
    required: false
    default: ''
  node-version:
    description: 'Node version to run dacs-drift under.'
    required: false
    default: '20'

runs:
  using: 'composite'
  steps:
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install dacs-drift (pathos-dacs-ref)
      shell: bash
      working-directory: ${{ github.action_path }}/../../..
      run: npm ci || npm install

    - name: Run dacs-drift conformance check
      shell: bash
      # Inputs (and the action path) are passed through env, NOT interpolated into the
      # script body — `${{ inputs.* }}` expands before bash parses, so inline use would let
      # a crafted value (`$(...)`, backticks) execute in the caller's CI. env vars are safe.
      env:
        ACTION_PATH: ${{ github.action_path }}
        FIXTURES_DIR: ${{ inputs.fixtures-dir }}
        EXPECT_MANIFEST: ${{ inputs.expect-manifest }}
      run: |
        set -uo pipefail
        ROOT="$(cd "$ACTION_PATH/../../.." && pwd)"
        FIXTURES="$(cd "$GITHUB_WORKSPACE/$FIXTURES_DIR" && pwd)"
        cd "$ROOT"
        # Capture the markdown drift table, surface it in BOTH the log and the GitHub
        # Step Summary (the Actions UI panel), and preserve dacs-drift's exit code so a
        # drift/struct-fail/missing still fails the job.
        if [ -n "$EXPECT_MANIFEST" ]; then
          OUT="$(npx tsx dacs-drift.mts "$FIXTURES" --expect "$GITHUB_WORKSPACE/$EXPECT_MANIFEST")"; RC=$?
        else
          OUT="$(npx tsx dacs-drift.mts "$FIXTURES")"; RC=$?
        fi
        echo "$OUT"
        if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          { echo "## DACS conformance / drift — \`dacs-drift\`"; echo; echo "$OUT"; } >> "$GITHUB_STEP_SUMMARY"
        fi
        exit "$RC"
